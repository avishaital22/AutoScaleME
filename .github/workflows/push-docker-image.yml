name: Push Docker Image After Scan

on:
  repository_dispatch:
    types: [start-push]

jobs:
  push-latest:
    runs-on: ubuntu-latest
    # Keep your original environment block
    environment: ${{ 
      github.event.workflow_run.head_branch == 'main' && 'production' || 
      github.event.workflow_run.head_branch == 'release' && 'staging' || 
      github.event.workflow_run.head_branch == 'test' && 'development' || 
      'development'
      }}
      
    steps:
      - name: Set environment variables from payload
        run: |
          echo "VERSION_TAG=${{ github.event.client_payload.version_tag }}" >> $GITHUB_ENV
          echo "SERVICE=${{ github.event.client_payload.service_name }}" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull SHA-tagged Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:${{ github.event.workflow_run.head_sha }}

      - name: Tag Docker image as latest
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:${{ github.event.workflow_run.head_sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:latest

      - name: Tag Docker image with version
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:${{ github.event.workflow_run.head_sha }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:${{ env.VERSION_TAG }}

      - name: Push latest tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/autoscaleme:${{ env.VERSION_TAG }}

      - name: Success message
        run: echo "Docker image pushed successfully"
